[workspace]
resolver = "3"
members = ["crates/chiaki-sys", "crates/rp-core", "crates/tether-core", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
chiaki-sys = { path = "crates/chiaki-sys" }
rp-core = { path = "crates/rp-core" }
tether-core = { path = "crates/tether-core" }

anyhow = "1"
base64 = "0.23"
bytemuck = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18"
crossbeam-channel = "0.5"
directories = "6"
# `format` isn't used, but ffmpeg-next 9 doesn't compile without it.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
hex = "0.4"
if-addrs = "0.13"
keyring = "4"
open = "5"
opus = "0.4"
sdl3 = "0.22"
serde = { version = "1", features = ["derive"] }
socket2 = "0.5"
softbuffer = "0.4"
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
url = "2"
winit = "0.30"

# build-time
bindgen = "0.72"
cc = "1.2"
cmake = "0.1"
pkg-config = "0.3"

[profile.release]
lto = "thin"

# SDL3 is built with CMake on Windows; at opt-level 0 that's a Debug build
# against the debug C runtime (/MDd), which clashes with Rust's /MD. Any
# optimisation makes it a release-runtime build.
[profile.dev.package.sdl3-sys]
opt-level = 1
