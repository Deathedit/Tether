name: CI

on:
  push:
    branches: [main, "milestone-*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Builds inside the flake's dev shell, the same environment as NixOS.
    name: Linux build + tests (Nix)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2

      - name: Warm up the dev shell
        run: nix develop --command true

      - run: nix develop --command cargo fmt --all --check
      - run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings
      - run: nix develop --command cargo test --workspace
      - run: nix develop --command cargo build --release -p tether-desktop

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          # nanopb's generator (protoc + Python protobuf) and libclang for
          # bindgen. CMake, perl and make (for OpenSSL) are on the runner.
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler python3-protobuf libclang-dev

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK (ANDROID_SDK_ROOT) with its
      # command-line tools; add the platform and NDK version we build with.
      - name: Install Android SDK platform and NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust core and Kotlin bindings
        run: sh android/build-rust.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build the APK
        run: gradle --project-dir android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tether-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Windows build + tests
    runs-on: windows-latest
    env:
      VCPKG_TRIPLET: x64-windows-static-md
      # ffmpeg-sys-next finds vcpkg's FFmpeg through this.
      FFMPEG_DIR: ${{ github.workspace }}\vcpkg_installed\x64-windows-static-md
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install protobuf

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Use vcpkg at exactly our builtin-baseline; the runner's own clone
          # is often older and lacks the port versions the baseline names.
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          $root = "$env:RUNNER_TEMP\vcpkg"
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout --quiet $baseline
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          & "$root\vcpkg.exe" install --triplet $env:VCPKG_TRIPLET

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # SDL3 and libopus are built from source by their crates, with the
      # CMake on the runner's PATH.
      - run: cargo test --workspace
      - run: cargo build --release -p tether-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: tether-windows-x86_64
          path: target/release/tether.exe
