name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Builds inside the flake's dev shell, the same environment as NixOS.
    name: Linux build + tests (Nix)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2

      - name: Warm up the dev shell
        run: nix develop --command true

      - run: nix develop --command cargo fmt --all --check
      - run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings
      - run: nix develop --command cargo test --workspace
      - run: nix develop --command cargo build --release -p tether-desktop

  windows:
    name: Windows build + tests
    runs-on: windows-latest
    env:
      VCPKG_TRIPLET: x64-windows-static-md
      # ffmpeg-sys-next finds vcpkg's FFmpeg through this.
      FFMPEG_DIR: ${{ github.workspace }}\vcpkg_installed\x64-windows-static-md
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install protobuf

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Use vcpkg at exactly our builtin-baseline; the runner's own clone
          # is often older and lacks the port versions the baseline names.
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          $root = "$env:RUNNER_TEMP\vcpkg"
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout --quiet $baseline
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          & "$root\vcpkg.exe" install --triplet $env:VCPKG_TRIPLET

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace
      - run: cargo build --release -p tether-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: tether-windows-x86_64
          path: target/release/tether.exe
