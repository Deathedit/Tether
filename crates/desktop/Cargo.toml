[package]
name = "tether-desktop"
description = "Tether desktop app for Linux and Windows: Slint UI, hardware video decoding, wgpu rendering, CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tether"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
open.workspace = true
rp-core.workspace = true
slint.workspace = true
tether-core.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
slint-build.workspace = true

# Linux: the system FFmpeg via pkg-config (Nix shell, Arch package).
[target.'cfg(not(windows))'.dependencies]
ffmpeg-next.workspace = true

# Windows: vcpkg's static FFmpeg, found through FFMPEG_DIR.
[target.'cfg(windows)'.dependencies]
ffmpeg-next = { workspace = true, features = ["static"] }
