[package]
name = "tether-core"
description = "Tether's shared app logic: settings, paired consoles, secrets, sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cpal = { workspace = true, optional = true }
directories.workspace = true
hex.workspace = true
opus = { workspace = true, optional = true }
rp-core.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

# Desktop secrets: Windows Credential Manager / Secret Service. Android keeps
# secrets in the Keystore on the Kotlin side instead.
[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
keyring.workspace = true

[features]
default = ["audio"]
# Session audio and microphone (cpal + libopus). Off for the Android build
# until milestone 7.
audio = ["dep:cpal", "dep:opus"]

[dev-dependencies]
tempfile.workspace = true
